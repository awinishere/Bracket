# =============================================================================
# Bracket – Quarkus BASE configuration
# -----------------------------------------------------------------------------
# This file contains only values that are common to every run stage.
# Profile-specific overrides live in sibling files (dash naming, so that
# Quarkus picks them up automatically when the profile is active):
#
#   application.yml        -> base (always loaded)
#   application-dev.yml    -> loaded when profile=dev   (`make dev`)
#   application-prod.yml   -> loaded when profile=prod  (`make start-prod`,
#                                                         docker image, CI)
#
# The `default` stage (`make start`) has no dedicated file: it simply uses
# the values below.
#
# The application NEVER uses the built-in `public` schema as its default.
# All tables live in the `bracket` schema, which is created by
# src/main/docker/schema/script/schema-init.sh on first Postgres boot.
# Additional schemas declared on entities via @Table(schema = "...") are
# auto-created in dev (see application-dev.yml).
# =============================================================================

quarkus:
  application:
    name: bracket
    version: 1.0-SNAPSHOT

  # ---- HTTP ---------------------------------------------------------------
  http:
    port: ${HTTP_PORT:8080}
    host: ${HTTP_HOST:0.0.0.0}
    root-path: /

  # ---- Logging ------------------------------------------------------------
  log:
    level: INFO
    console:
      format: "%d{yyyy-MM-dd HH:mm:ss} %-5p [%c{3.}] (%t) %s%e%n"

  # ---- Datasource ---------------------------------------------------------
  datasource:
    db-kind: postgresql
    devservices:
      enabled: false      # we manage Postgres via docker-compose, not Dev Services
    metrics:
      enabled: false
    jdbc:
      url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:bracket}?currentSchema=${APP_SCHEMA:bracket}
      acquisition-timeout: 10S
      validation-timeout: 5S
      leak-detection-interval: 0
      max-size: ${DB_POOL_MAX:20}
      min-size: ${DB_POOL_MIN:5}
      initial-size: ${DB_POOL_MIN:5}
      foreground-initial-size: 1
    username: ${POSTGRES_USER:bracket}
    password: ${POSTGRES_PASSWORD:bracket}

  # ---- Hibernate ORM ------------------------------------------------------
  hibernate-orm:
    database:
      default-schema: ${APP_SCHEMA:bracket}
      default-catalog: ${POSTGRES_DB:bracket}
    schema-management:
      strategy: update            # safe default; overridden per-profile

  # ---- Flyway -------------------------------------------------------------
  flyway:
    migrate-at-start: true
    baseline-on-migrate: true
    baseline-version: 0
    clean-disabled: true
    create-schemas: true
    default-schema: ${APP_SCHEMA:bracket}
    schemas: ${APP_SCHEMA:bracket}
    locations: classpath:db/migration

  # ---- OpenAPI / Swagger UI ----------------------------------------------
  # The OpenAPI document is served at the extension default (/q/openapi).
  swagger-ui:
    path: /q/swagger-ui

  # ---- Mailer (defaults; override via env in prod) ------------------------
  mailer:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    from: ${MAIL_FROM:no-reply@bracket.local}

  # ---- Object storage: Cloudflare R2 (S3-compatible) ----------------------
  # R2 speaks the S3 API, so we reuse the AWS SDK v2 S3 client and point it
  # at the R2 endpoint. Dev Services is disabled: there is no local S3 stack,
  # the bucket lives in R2 and is configured purely via env vars.
  s3:
    devservices:
      enabled: false
    path-style-access: ${R2_PATH_STYLE:true}
    endpoint-override: ${R2_ENDPOINT:https://127.0.0.1:9999}
    aws:
      region: ${R2_REGION:auto}
      credentials:
        type: static
        static-provider:
          access-key-id: ${R2_ACCESS_KEY_ID:access-key}
          secret-access-key: ${R2_SECRET_ACCESS_KEY:secret-key}

# ---- Application-specific (non-Quarkus-namespace) config ------------------
bracket:
  blob:
    bucket: ${R2_BUCKET:bracket}
