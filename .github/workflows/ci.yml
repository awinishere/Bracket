name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "21"

jobs:
  unit-test:
    name: Unit tests (JDK 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Make mvnw executable
        run: chmod +x ./mvnw

      # BucketRepositoryAdapterTest (@QuarkusTest) queries a REAL Postgres,
      # matching the defaults in src/test/resources/application.yml:
      #   jdbc:postgresql://localhost:5433/bracket_test (user/pass: bracket)
      # Hibernate drop-and-create needs the entity schemas to already exist.
      - name: Start test Postgres (bracket_test on :5433)
        run: |
          docker run -d --name bracket-test-db \
            -e POSTGRES_USER=bracket \
            -e POSTGRES_PASSWORD=bracket \
            -e POSTGRES_DB=bracket_test \
            -p 5433:5432 \
            postgres:16-alpine
          timeout 60 bash -c 'until docker exec bracket-test-db pg_isready -U bracket -d bracket_test; do sleep 2; done'
          docker exec bracket-test-db psql -U bracket -d bracket_test \
            -c 'CREATE SCHEMA IF NOT EXISTS bucket;' \
            -c 'CREATE SCHEMA IF NOT EXISTS bracket;'

      - name: Run unit tests
        run: ./mvnw -B -ntp -DskipITs clean test

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ github.run_number }}
          path: target/surefire-reports/
          retention-days: 7
          if-no-files-found: ignore

      - name: Publish test summary
        if: always()
        run: |
          {
            echo "## Unit test summary"
            echo ""
            echo '```'
            find target/surefire-reports -name '*.txt' -exec cat {} \; 2>/dev/null \
              | grep -E "^(Tests run|Running)" | head -60 || echo "no surefire output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
